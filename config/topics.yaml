/**:
  ros__parameters:
    # Timing
    rate_hz: 50.0
    watchdog_ms: 100

    # Autoware topics (vehicle_cmd_gate outputs)
    aw_control_cmd: /control/command/control_cmd
    aw_gear_cmd: /control/command/gear_cmd
    aw_turn_cmd: /control/command/turn_indicators_cmd
    aw_hazard_cmd: /control/command/hazard_lights_cmd
    aw_engage: /api/autoware/get/engage

    # DBW topics (commands)
    dbw_throttle_cmd: /vehicle/throttle_cmd
    dbw_brake_cmd: /vehicle/brake_cmd
    dbw_steering_cmd: /vehicle/steering_cmd
    dbw_gear_cmd: /vehicle/gear_cmd
    dbw_misc_cmd: /vehicle/misc_cmd

    # DBW enable/disable (THIS PLATFORM USES std_msgs/Empty)
    dbw_enable_topic: /vehicle/enable
    dbw_disable_topic: /vehicle/disable
    dbw_dbw_enabled: /vehicle/dbw_enabled

    # DBW report topics (used by gear + intelligent steering)
    dbw_steering_report: /vehicle/steering_report   # contains speed (m/s) + steering_wheel_angle (rad)
    dbw_gear_report: /vehicle/gear_report
    dbw_misc_report: /vehicle/misc_1_report

    # Hazard shim
    hazard_shim_topic: /mkz_interface/hazard_cmd_latched
    hazard_shim_timeout_ms: 2000

    # Vehicle constants
    steering_wheel_to_tire_ratio: 14.8
    max_steering_wheel_angle_deg: 470.0

    # Steering sign: +1 keeps Autoware convention (positive = LEFT).
    # Set -1 if your physical steering turns the opposite way.
    steering_sign: 1.0

    # --- Intelligent steering velocity (recommended ON) ---
    steer_vel_enable: true
    steer_vel_min: 3.0           # rad/s minimum
    steer_vel_gain: 3.0          # rad/s per rad of wheel-angle error
    steer_vel_tau: 0.25          # seconds low-pass on velocity
    steer_vel_dv_max: 10.0       # rad/s^2 max dv/dt

    # Speed-based caps (piecewise linear)
    steer_vel_cap_speeds: [0.0, 2.0, 10.0, 25.0, 35.0]  # m/s
    steer_vel_cap_vels:   [10.0, 9.0, 7.0, 5.0, 4.5]    # rad/s

    # Legacy fixed steering velocity (used if steer_vel_enable=false)
    steering_wheel_angle_velocity: 3.0

    # Report freshness window used by interlock + intelligent steering
    report_fresh_ms: 300

    # Gating
    require_engage: true
    require_dbw_enabled: true
    auto_enable_on_engage: false
    publish_safe_zero_when_not_ready: true

    # Longitudinal mapping (accel -> percent)
    accel_to_throttle_gain: 0.25
    accel_to_brake_gain: 0.30
    max_throttle: 0.25
    max_brake: 0.40
    throttle_deadband: 0.01
    brake_deadband: 0.01

    # --- Interlock (brake-to-shift) ---
    gear_change_requires_brake: true
    gear_change_brake_percent: 0.70
    gear_post_shift_hold_ms: 1000
    gear_change_speed_thresh: 0.10
    gear_change_timeout_ms: 3000
    gear_report_match_required: true

    # Autoware status topics (published by dbw_can_to_autoware.py)
    aw_velocity_status: /vehicle/status/velocity_status
    aw_steering_status: /vehicle/status/steering_status
    aw_gear_status: /vehicle/status/gear_status
    aw_turn_status: /vehicle/status/turn_indicators_status
    aw_hazard_status: /vehicle/status/hazard_lights_status
    aw_control_mode_status: /vehicle/status/control_mode
    aw_steering_status_for_gate: /vehicle_cmd_gate/input/steering
